
name: Microservices CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Validate, Test and Publish Services
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          pytest -v

      - name: Validate Python syntax
        run: |
          python -m compileall -q services

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Login to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build User Service image
        run: |
          docker build \
            -f services/user-service/Dockerfile \
            -t "$DOCKERHUB_USERNAME/user-service:latest" \
            -t "$DOCKERHUB_USERNAME/user-service:${GITHUB_SHA}" \
            .

      - name: Build Order Service image
        run: |
          docker build \
            -f services/order-service/Dockerfile \
            -t "$DOCKERHUB_USERNAME/order-service:latest" \
            -t "$DOCKERHUB_USERNAME/order-service:${GITHUB_SHA}" \
            .

      - name: Push User Service image
        run: |
          docker push "$DOCKERHUB_USERNAME/user-service:latest"
          docker push "$DOCKERHUB_USERNAME/user-service:${GITHUB_SHA}"

      - name: Push Order Service image
        run: |
          docker push "$DOCKERHUB_USERNAME/order-service:latest"
          docker push "$DOCKERHUB_USERNAME/order-service:${GITHUB_SHA}"
